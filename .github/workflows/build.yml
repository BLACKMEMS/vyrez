name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Download model
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 -o app/src/main/assets/magic_touch.tflite \
            https://storage.googleapis.com/mediapipe-models/interactive_segmenter/magic_touch/float32/1/magic_touch.tflite \
          || curl -fL --retry 3 -o app/src/main/assets/magic_touch.tflite \
            https://storage.googleapis.com/mediapipe-models/interactive_segmenter/magic_touch/float32/latest/magic_touch.tflite
          ls -la app/src/main/assets

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk vyrez.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vyrez-apk
          path: vyrez.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Vyrez build ${{ github.run_number }}
          make_latest: "true"
          files: vyrez.apk
          
